{% load static %}<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechStore</title><link rel="stylesheet" href="{% static 'css/sites.css' %}"></head><body>
<nav><a class="marca" href="{% url 'home' %}">TECHSTORE</a><a href="{% url 'produtos' %}">Produtos</a>{% if user.is_authenticated %}<a href="{% url 'carrinho' %}">Carrinho</a><a href="{% url 'meus_pedidos' %}">Pedidos</a>{% if user.is_staff %}<a href="{% url 'painel' %}">Painel</a>{% endif %}<a href="{% url 'logout' %}">Sair</a>{% else %}<a href="{% url 'login' %}">Entrar</a>{% endif %}</nav>
<main class="wrap">{% for message in messages %}<div class="msg">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
