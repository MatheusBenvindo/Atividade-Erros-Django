{% extends 'loja/base.html' %}{% block content %}<h1>Produtos</h1><div class="grid">{% for p in produtos %}<div class="card"><h3>{{p.nome}}</h3><p>{{p.descricao}}</p><strong>R$ {{p.preco}}</strong><p>Estoque: {{p.estoque}}</p>{% if user.is_authenticated %}<form method="post" action="{% url 'adicionar_carrinho' p.id %}"><input name="qtd" type="number" value="1" min="1"><button class="btn">Adicionar</button></form>{% endif %}</div>{% empty %}<p>Nenhum produto.</p>{% endfor %}</div>{% endblock %}
